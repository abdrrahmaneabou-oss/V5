          s = s.replace('text = "بدء النصف الأيمن"', 'text = "بدء PixelTrigger V5"')
          s = s.replace('addView(body("يمكن تشغيل النصفين معًا. لكل نصف دوائره وقائمته ونافذته العائمة الخاصة."))',
