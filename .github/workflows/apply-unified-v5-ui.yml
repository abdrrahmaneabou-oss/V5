name: Apply unified V5 architecture

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-unified-v5-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge capture and floating control architecture
        shell: bash
        run: |
