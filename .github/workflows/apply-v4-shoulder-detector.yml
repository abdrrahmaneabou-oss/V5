name: Apply V4 detector to Shoulder

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v4-shoulder-detector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Shoulder detector with exact V4 DetectionEngine path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/pixeltrigger/app/ShoulderCaptureService.kt')
          s = p.read_text()

          s = s.replace('import com.pixeltrigger.app.engine.ShoulderDetectionEngine\n', 'import com.pixeltrigger.app.engine.DetectionEngine\n')
          if 'import android.os.SystemClock\n' not in s:
              s = s.replace('import android.os.Process\n', 'import android.os.Process\nimport android.os.SystemClock\n')

          old = '''    private val rDetector = ShoulderDetectionEngine()\n    private val lDetector = ShoulderDetectionEngine()\n'''
          new = '''    // Shoulder monitoring uses the exact same V4 detector implementation, one\n    // independent detector per 0.3 mm circle. Only the FIRE action differs.\n    private val rDetectors = Array(MONITORS_PER_SIDE) { DetectionEngine() }\n    private val lDetectors = Array(MONITORS_PER_SIDE) { DetectionEngine() }\n'''
          if old not in s:
              raise SystemExit('old shoulder detector fields not found')
          s = s.replace(old, new)

          old = '''        prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)\n        shoulderInput = ShoulderShizukuEngine(this)\n'''
          new = '''        prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)\n\n        // Mirror the V4 detector configuration so both halves use the same\n        // arming/rearm behavior and thresholds. The detector class itself is\n        // shared; only the action emitted on FIRE is different.\n        val v4Prefs = getSharedPreferences("pixeltrigger_prefs", MODE_PRIVATE)\n        val whiteRearm = v4Prefs.getBoolean("white_rearm_enabled", true)\n        val delayEnabled = v4Prefs.getBoolean("rearm_delay_enabled", false)\n        val rearmSeconds = v4Prefs.getInt("rearm_seconds", 10).coerceIn(5, 60)\n        (rDetectors.asList() + lDetectors.asList()).forEach { engine ->\n            engine.whiteRearmEnabled = whiteRearm\n            engine.rearmDelayEnabled = delayEnabled\n            engine.rearmSeconds = rearmSeconds\n        }\n\n        shoulderInput = ShoulderShizukuEngine(this)\n'''
          if old not in s:
              raise SystemExit('onCreate prefs marker not found')
          s = s.replace(old, new)

          start = s.index('    private fun processImage(image: Image) {')
          end = s.index('    private fun pressDurationMs(side: Side): Int {')
          replacement = '''    private fun processImage(image: Image) {\n        if (editSide != null || screenWidth <= 0 || screenHeight <= 0) return\n        val crop = image.cropRect\n        if (crop.width() <= 0 || crop.height() <= 0) return\n\n        val inputReady = shoulderInput.isReady()\n        if (inputReady != lastInputReady) {\n            lastInputReady = inputReady\n            mainHandler.post { refreshStatusViews() }\n        }\n\n        val nowMs = SystemClock.elapsedRealtime()\n        processSide(Side.R, image, crop, rParams, rDetectors, inputReady, nowMs)\n        processSide(Side.L, image, crop, lParams, lDetectors, inputReady, nowMs)\n    }\n\n    /**\n     * Exact V4 monitoring loop: each 0.3 mm circle is sampled with PixelSampler\n     * and fed to DetectionEngine.processSample(). Sibling detectors on the same\n     * side are synchronized after FIRE exactly like V4's active group.\n     */\n    private fun processSide(\n        side: Side,\n        image: Image,\n        crop: Rect,\n        params: Array<WindowManager.LayoutParams?>,\n        detectors: Array<DetectionEngine>,\n        inputReady: Boolean,\n        nowMs: Long,\n    ) {\n        var local = 0\n        var statusChanged = false\n        while (local < MONITORS_PER_SIDE) {\n            val lp = params[local]\n            if (lp != null) {\n                val sample = sample(image, crop, lp)\n                if (sample != null) {\n                    when (detectors[local].processSample(sample, nowMs)) {\n                        is DetectionEngine.Event.Armed,\n                        is DetectionEngine.Event.Rearmed,\n                        is DetectionEngine.Event.ManualRearmed -> statusChanged = true\n\n                        is DetectionEngine.Event.Fired -> {\n                            var sibling = 0\n                            while (sibling < MONITORS_PER_SIDE) {\n                                if (sibling != local) detectors[sibling].synchronizeAfterExternalFire(nowMs)\n                                sibling++\n                            }\n                            if (inputReady) {\n                                if (side == Side.R) shoulderInput.fireR(pressDurationMs(Side.R))\n                                else shoulderInput.fireL(pressDurationMs(Side.L))\n                            }\n                            mainHandler.post {\n                                setSideStatus(\n                                    side,\n                                    if (inputReady) ShoulderSensorOverlayView.Status.FIRED\n                                    else ShoulderSensorOverlayView.Status.INPUT_NOT_READY,\n                                )\n                            }\n                            return\n                        }\n\n                        else -> Unit\n                    }\n                }\n            }\n            local++\n        }\n        if (statusChanged) mainHandler.post { refreshSideStatus(side, inputReady) }\n    }\n\n    private fun sample(image: Image, crop: Rect, lp: WindowManager.LayoutParams) = run {\n        val screenCenterX = lp.x + touchSize / 2\n        val screenCenterY = lp.y + touchSize / 2\n        val centerX = (crop.left + screenCenterX * crop.width().toFloat() / screenWidth).roundToInt()\n            .coerceIn(crop.left, crop.right - 1)\n        val centerY = (crop.top + screenCenterY * crop.height().toFloat() / screenHeight).roundToInt()\n            .coerceIn(crop.top, crop.bottom - 1)\n        val screenRadius = visibleDiameter / 2f\n        val radiusX = max(0.5f, crop.width() * screenRadius / screenWidth)\n        val radiusY = max(0.5f, crop.height() * screenRadius / screenHeight)\n        PixelSampler.sampleCircularRegion(image, centerX, centerY, radiusX, radiusY)\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          s = s.replace('''        rDetector.reset()\n        lDetector.reset()\n''', '''        resetShoulderDetectors()\n''')

          # Replace status implementation that depended on ShoulderDetectionEngine.
          start = s.index('    private fun refreshStatusViews() {')
          end = s.index('    private fun setSideStatus(', start)
          replacement = '''    private fun resetShoulderDetectors() {\n        rDetectors.forEach { it.resetForSensorMove() }\n        lDetectors.forEach { it.resetForSensorMove() }\n    }\n\n    private fun refreshStatusViews() {\n        val ready = shoulderInput.isReady()\n        refreshSideStatus(Side.R, ready)\n        refreshSideStatus(Side.L, ready)\n        refreshMenuStatus()\n    }\n\n    private fun refreshSideStatus(side: Side, inputReady: Boolean) {\n        if (!inputReady) {\n            setSideStatus(side, ShoulderSensorOverlayView.Status.INPUT_NOT_READY)\n            return\n        }\n        val detectors = if (side == Side.R) rDetectors else lDetectors\n        val status = when {\n            detectors.any { it.state == DetectionEngine.State.ARMED } -> ShoulderSensorOverlayView.Status.ARMED\n            detectors.any { it.state == DetectionEngine.State.WAITING_REARM } -> ShoulderSensorOverlayView.Status.FIRED\n            else -> ShoulderSensorOverlayView.Status.WAITING\n        }\n        setSideStatus(side, status)\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          # Documentation / notification now describes V4 detector, not red detector.
          s = s.replace('R/L red trigger monitor is active', 'R/L V4-quality trigger monitor is active')
          s = s.replace('red-fire', 'V4 detector FIRE')
          s = s.replace('الأحمر = FIRE، وأي لون غير الأحمر = ARM.', 'نفس محرك المراقبة والتسليح الخاص بالنصف الأيمن تمامًا؛ الاختلاف فقط في إجراء FIRE.')

          p.write_text(s)

          # Main screen copy: remove the obsolete red/non-red description.
          p = Path('app/src/main/java/com/pixeltrigger/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('الأحمر = FIRE، وأي لون غير الأحمر = ARM. GameSpace وحده يحدد ماذا يفعل R وL.',
                        'نفس نظام مراقبة PixelProbe V4 في النصف الأيمن من حيث التسليح والكشف والسرعة. عند FIRE فقط يختلف التنفيذ: R أو L عبر GameSpace.')
          p.write_text(s)
          PY

          # Remove the obsolete red/non-red detector and its tests completely.
          git rm -f app/src/main/java/com/pixeltrigger/app/engine/ShoulderDetectionEngine.kt || true
          git rm -f app/src/test/java/com/pixeltrigger/app/engine/ShoulderDetectionEngineTest.kt || true
          git rm .github/workflows/apply-v4-shoulder-detector.yml

          git config user.name 'PixelTrigger V5 Detector Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/pixeltrigger/app/ShoulderCaptureService.kt \
                  app/src/main/java/com/pixeltrigger/app/MainActivity.kt
          git commit -m 'v5 shoulder: use exact V4 detector and keep R/L FIRE actions'
          git pull --rebase origin main
          git push origin HEAD:main
