        fun sideRow(label: String, prefix: String): View {
            val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
            val hold = Switch(this).apply { text = "$label HOLD"; isChecked = shoulderPrefs.getBoolean("shoulder_${prefix}_hold", false); setTextColor(Color.rgb(68, 35, 45)) }
            val value = TextView(this).apply { gravity = Gravity.CENTER; textSize = 13f; setTextColor(Color.rgb(68, 35, 45)) }
            fun refresh() { value.text = if (hold.isChecked) "${shoulderPrefs.getInt("shoulder_${prefix}_seconds", 1).coerceIn(1, 5)}s" else "Flash" }
            hold.setOnCheckedChangeListener { _, checked -> shoulderPrefs.edit().putBoolean("shoulder_${prefix}_hold", checked).apply(); refresh() }
            val minus = menuButton("−") { val n = (shoulderPrefs.getInt("shoulder_${prefix}_seconds", 1) - 1).coerceIn(1, 5); shoulderPrefs.edit().putInt("shoulder_${prefix}_seconds", n).apply(); refresh() }
            val plus = menuButton("+") { val n = (shoulderPrefs.getInt("shoulder_${prefix}_seconds", 1) + 1).coerceIn(1, 5); shoulderPrefs.edit().putInt("shoulder_${prefix}_seconds", n).apply(); refresh() }
            row.addView(hold, LinearLayout.LayoutParams(0, dp(46), 1f)); row.addView(minus, LinearLayout.LayoutParams(dp(48), dp(42))); row.addView(value, LinearLayout.LayoutParams(dp(54), dp(42))); row.addView(plus, LinearLayout.LayoutParams(dp(48), dp(42)))
            refresh(); return row
        }
        card.addView(sideRow("R", "r"), matchWrap(dp(48)))
        card.addView(sideRow("L", "l"), matchWrap(dp(48)))
        val editRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
        editRow.addView(menuButton("تعديل R") { shoulderAction(ShoulderCaptureService.ACTION_EDIT_R) }, LinearLayout.LayoutParams(0, dp(46), 1f))
        editRow.addView(menuButton("تعديل L") { shoulderAction(ShoulderCaptureService.ACTION_EDIT_L) }, LinearLayout.LayoutParams(0, dp(46), 1f))
        editRow.addView(menuButton("✓ حفظ") { shoulderAction(ShoulderCaptureService.ACTION_DONE_EDIT) }, LinearLayout.LayoutParams(0, dp(46), 1f))
        card.addView(editRow, matchWrap(dp(48)))
        val resetRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
        resetRow.addView(menuButton("↺ R للمنتصف") { shoulderAction(ShoulderCaptureService.ACTION_RESET_R) }, LinearLayout.LayoutParams(0, dp(46), 1f))
        resetRow.addView(menuButton("↺ L للمنتصف") { shoulderAction(ShoulderCaptureService.ACTION_RESET_L) }, LinearLayout.LayoutParams(0, dp(46), 1f))
        card.addView(resetRow, matchWrap(dp(48)))
        return card
    }

